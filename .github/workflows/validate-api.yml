
name: Validate Visitor Counter API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: node --check api/visitorCount.js

      - name: Check visitor counter test syntax
        run: node --check tests/visitorCount.test.js

      - name: Run visitor counter simulation tests
        run: node --test tests/visitorCount.test.js
